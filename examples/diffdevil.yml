version: 1
presets:
  - size@1
size:
  labels:
    xs: '📏 Size: XS'
    s: '📏 Size: S'
    m: '📏 Size: M'
    l: '📏 Size: L'
    xl: '📏 Size: XL'
    unknown: '📏 Size: Unknown'
rules:
  xl-reply:
    when: metrics.review >= 1000
    onUnknown: hold
    effects:
      comment:
        mode: once-per-transition
        trigger: matched
        templateFile: .github/automation/messages/diffdevil-xl.md
